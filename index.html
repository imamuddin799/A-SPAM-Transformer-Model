                        if (current) {
                            current.classList.add("is-active");
                            if (forceRefresh || domNeedsRefresh || ayahChanged) {
                                current.scrollIntoView({ behavior: "auto", block: "nearest", inline: "nearest" });
                            }
                        }
                        context.currentAyah = active.ayah;
                        const label = $("#audioReaderCurrentAyah");
                        if (label) label.textContent = `Now playing · Ayah ${active.ayah} of ${context.ayahCount}`;
                        state.lastRecited = { surah: context.surah, ayah: active.ayah, name: surahName(getSurah(context.surah)) };
                        localStorage.setItem("alquran_lastrecited", JSON.stringify(state.lastRecited));
                    }
                }

                async function playAyah(s, a) {
                    // Individual-Ayah playback must not inherit full-Surah auto-advance.
                    state.audioLibraryPlayback = null;
                    state.audioPlaybackSource = null;
                    try {
                        const data = unwrap(await api(`/api/quran/audio/${s}/${a}`));
                        const items = asArray(data);
                        const rec =
                            items.find((x) => String(pick(x, ["reciter_id", "id"])) === String(state.reciter)) ||
                            items[0] ||
                            data;
                        const url = pick(
                            rec,
                            ["audio_url", "url", "audio", "src", "recitation_url"],
                            typeof rec === "string" ? rec : ""
                        );
                        if (!url) throw new Error("No playable audio URL was returned.");
                        state.lastRecited = { surah: s, ayah: a, name: surahName(getSurah(s)) };
                        localStorage.setItem("alquran_lastrecited", JSON.stringify(state.lastRecited));
                        state.audioQueue = [url];
                        state.audioIndex = 0;
                        const selected = state.reciters.find(
                            (r) => String(pick(r, ["id", "reciter_id", "reciterId"])) === String(state.reciter)
                        );
                        const reciterName = pick(
                            selected || {},
                            ["name", "english_name", "reciter_name"],
                            "Default reciter"
                        );
                        setAudio(url, `${s}. ${surahName(getSurah(s))} · Ayah ${a}`, reciterName);
                    } catch (e) {
                        notify(e.message);
                    }
                }
                async function playSurah(s, sourcePage = state.page) {
                    // Playlist/queue callers set this context before entering playSurah.
                    // A normal manual Surah selection clears collection playback mode.
                    if (sourcePage !== "audio" || !state.audioLibraryPlayback || Number(state.audioLibraryPlayback.currentSurah) !== Number(s)) state.audioLibraryPlayback = null;
                    // Clear the previous origin while the newly selected Surah is loading.
                    state.audioPlaybackSource = null;
                    try {
                        const fullAudio = await fetchFullSurahAudio(s);
                        state.audioQueue = [fullAudio.url];
                        state.audioIndex = 0;
                        state.lastRecited = { surah: s, ayah: 1, name: surahName(getSurah(s)) };
                        localStorage.setItem("alquran_lastrecited", JSON.stringify(state.lastRecited));
                        state.audioPlaybackSource = {
                            kind: "full-surah",
                            sourcePage: sourcePage === "reader" || sourcePage === "audio" ? sourcePage : "audio",
                            surah: Number(s),
                        };
                        setAudio(fullAudio.url, `${s}. ${surahName(getSurah(s))} · Full Surah`, fullAudio.reciterName);
                    } catch (e) {
                        notify(e.message || "Unable to load full-Surah audio.");
                    }
                }
                function setAudio(url, t, sub, playbackContext = null, autoPlay = true) {
                    state.audioPlaybackContext = playbackContext;
                    audio.src = url;
                    audio.load();
                    const playerTitle = $("#playerTitle");
                    playerTitle.replaceChildren();
                    const fullSurahMarker = " · Full Surah";
                    if (t.endsWith(fullSurahMarker)) {
                        playerTitle.append(document.createTextNode(t.slice(0, -fullSurahMarker.length)));
                        const marker = document.createElement("small");
                        marker.className = "player-title-tag";
                        marker.textContent = "Full Surah";
                        playerTitle.append(document.createTextNode(" "));
                        playerTitle.append(marker);
                    } else {
                        playerTitle.textContent = t;
                    }
                    $("#playerSub").textContent = sub;
                    $("#playPause").textContent = "▶";
                    if (autoPlay) {
                        audio.play()
                            .then(() => ($("#playPause").textContent = "Ⅱ"))
                            .catch(() => notify("Press play to start audio."));
                    }
                }
                async function playNext() {
                    if (state.audioPlaybackSource?.sourcePage === "audio" && (state.audioLibraryPlayback || state.audioLibraryQueue.length)) {
                        await playAudioLibraryNext();
                        return;
                    }
                    // Preserve the original multi-track queue behavior.
                    if (state.audioQueue.length > 1) {
                        state.audioIndex = (state.audioIndex + 1) % state.audioQueue.length;
                        setAudio(
                            state.audioQueue[state.audioIndex],
                            $("#playerTitle").textContent,
                            $("#playerSub").textContent
                        );
                        return;
                    }

                    if (state.audioNextInProgress) return;
                    const source = state.audioPlaybackSource;
                    if (!source || source.kind !== "full-surah") return;

                    const currentSurah = Number(source.surah);
                    const nextSurah = currentSurah + 1;
                    // Do not wrap from Surah 114 back to Surah 1.
                    if (!Number.isInteger(currentSurah) || nextSurah > 114) return;

                    state.audioNextInProgress = true;
                    audio.pause();
                    try {
                        if (source.sourcePage === "reader") {
                            // Quran Reader: load the next Surah in the reader, then play it.
                            const loaded = await loadSurah(nextSurah, 1);
                            if (!loaded) return;
                            await playSurah(nextSurah, "reader");
                            return;
                        }

                        if (source.sourcePage === "audio") {
                            // Listen to the Quran: keep this page as-is; update only its
                            // selected Surah and start the next full-Surah audio.
                            const surahSelect = $("#audioSurahSelect");
                            if (surahSelect) surahSelect.value = String(nextSurah);
                            await playSurah(nextSurah, "audio");
                            return;
                        }

                        if (source.sourcePage === "audio-reader") {
                            // Live highlighting: prepare the next Surah's text, audio and
                            // reciter-specific Ayah timings before starting playback.
                            if (state.page !== "audio-reader") go("audio-reader");
                            const surahSelect = $("#audioReaderSurah");
                            if (!surahSelect) throw new Error("The live Ayah reader could not be opened.");
                            surahSelect.value = String(nextSurah);
                            const prepared = await prepareAudioReader();
                            if (!prepared || Number(state.audioReaderPrepared?.surah) !== nextSurah) return;

                            state.audioPlaybackSource = {
                                kind: "full-surah",
                                sourcePage: "audio-reader",
                                surah: nextSurah,
                            };
                            await audio.play();
                            $("#playPause").textContent = "Ⅱ";
                            const readerPlayButton = $("#playAudioReader");
                            if (readerPlayButton) readerPlayButton.textContent = "Ⅱ Playing Full Surah";
                            syncAudioAyahHighlight(true);
                            void syncAudioReaderWakeLock();
                        }
                    } catch (error) {
                        notify(error.message || "Unable to load the next Surah.");
                    } finally {
                        state.audioNextInProgress = false;
                    }
                }
                function fmt(n) {
                    if (!Number.isFinite(n)) return "0:00";
                    return `${Math.floor(n / 60)}:${String(Math.floor(n % 60)).padStart(2, "0")}`;
                }
                audio.addEventListener("play", () => { void syncAudioReaderWakeLock(); updateAudioReaderWakeLockDebug(); });
                audio.addEventListener("pause", () => { void syncAudioReaderWakeLock(); updateAudioReaderWakeLockDebug(); });
                audio.addEventListener("ended", () => { void syncAudioReaderWakeLock(); updateAudioReaderWakeLockDebug(); });
                audio.addEventListener("timeupdate", () => {
                    syncAudioAyahHighlight();
                    updateAudioReaderWakeLockDebug();
                    if (shouldHoldAudioReaderWakeLock() && !audioReaderWakeLock && Date.now() - audioReaderWakeLockLastAttempt >= 5000) {
                        void syncAudioReaderWakeLock();
                    }
                    if (audio.duration) {
                        $("#audioProgress").value = (audio.currentTime / audio.duration) * 100;
                        $("#currentTime").textContent = fmt(audio.currentTime);
                        $("#duration").textContent = fmt(audio.duration);
                    }
                });
                audio.addEventListener("loadedmetadata", () => syncAudioAyahHighlight(true));
                audio.addEventListener("seeked", () => syncAudioAyahHighlight(true));
                audio.addEventListener("playing", () => syncAudioAyahHighlight(true));
                $("#audioProgress").oninput = (e) => {
                    if (audio.duration) audio.currentTime = (audio.duration * e.target.value) / 100;
                };
                $("#playPause").onclick = () => {
                    if (!audio.src) return notify("Choose an Ayah or Surah first.");
                    if (audio.paused) audio.play().then(() => ($("#playPause").textContent = "Ⅱ"));
                    else {
                        audio.pause();
                        $("#playPause").textContent = "▶";
                    }
                };
                $("#nextAudio").onclick = () => { void playNext(); };
                $("#prevAudio").onclick = () => {
                    audio.currentTime = 0;
                };
                // The same page-aware transition runs for manual Next and when a
                // complete Surah reaches its end.
                audio.addEventListener("ended", () => { void playNext(); });
                document.querySelectorAll(".nav button").forEach((b) => (b.onclick = () => go(b.dataset.page)));
                $("#menuBtn").onclick = () => $("#sidebar").classList.toggle("open");
                $("#closeSidebar").onclick = () => $("#sidebar").classList.remove("open");

                // Searchable modal dropdowns: preserve native select values/events for existing app logic.
                let activeCustomSelect = null;
                const selectBackdrop = document.createElement("div");
                selectBackdrop.className = "custom-select-modal-backdrop";
                selectBackdrop.setAttribute("aria-hidden", "true");
                document.body.appendChild(selectBackdrop);

                function closeSelectModal(returnFocus = false) {
                    if (!activeCustomSelect) return;
                    const current = activeCustomSelect;
                    current.wrap.classList.remove("open");
                    current.trigger.setAttribute("aria-expanded", "false");
                    current.menuSearch.value = "";
                    current.menu.querySelectorAll(".custom-select-option").forEach((option) => (option.hidden = false));
                    activeCustomSelect = null;
                    selectBackdrop.classList.remove("show");
                    selectBackdrop.setAttribute("aria-hidden", "true");
                    if (returnFocus) current.trigger.focus();
                }

                function enhanceSelect(select) {
                    if (!select || select.dataset.customized === "1" || !select.options.length) return;
                    select.dataset.customized = "1";
                    const wrap = document.createElement("div");
                    wrap.className = "custom-select";
                    select.parentNode.insertBefore(wrap, select);
                    wrap.appendChild(select);

                    const trigger = document.createElement("button");
                    trigger.type = "button";
                    trigger.className = "custom-select-trigger";
                    trigger.setAttribute("aria-haspopup", "dialog");
                    trigger.setAttribute("aria-expanded", "false");

                    const label = document.createElement("span");
                    const caret = document.createElement("span");
                    caret.className = "custom-select-caret";
                    caret.textContent = "⌄";
                    trigger.append(label, caret);

                    const menu = document.createElement("div");
                    menu.className = "custom-select-menu";
                    menu.setAttribute("role", "dialog");
                    menu.setAttribute("aria-modal", "true");
                    menu.setAttribute(
                        "aria-label",
                        select.closest("label")?.childNodes[0]?.textContent?.trim() || "Choose an option"
                    );
                    menu.dataset.title =
                        select.closest("label")?.childNodes[0]?.textContent?.trim() || "Choose an option";

                    const menuHeader = document.createElement("div");
                    menuHeader.className = "custom-select-menu-header";
                    const menuTitle = document.createElement("span");
                    menuTitle.className = "custom-select-menu-title";
                    menuTitle.textContent = menu.dataset.title;
                    const closeButton = document.createElement("button");
                    closeButton.type = "button";
                    closeButton.className = "custom-select-close";
                    closeButton.setAttribute("aria-label", "Close dropdown");
                    closeButton.title = "Close";
                    closeButton.textContent = "×";
                    menuHeader.append(menuTitle, closeButton);

                    const search = document.createElement("input");
                    search.type = "search";
                    search.className = "custom-select-search";
                    search.placeholder = "Search options…";
                    search.setAttribute("aria-label", "Search dropdown options");
                    search.autocomplete = "off";

                    const optionsBox = document.createElement("div");
                    optionsBox.className = "custom-select-options";
                    menu.append(menuHeader, search, optionsBox);
                    wrap.append(trigger, menu);

                    const isQueueMultiSelect = select.id === "audioQueueSurahSelect" && select.multiple;
                    let multiFooter = null;
                    let multiAddButton = null;
                    function refresh() {
                        if (isQueueMultiSelect) {
                            const selectedCount = Array.from(select.selectedOptions).filter((opt) => opt.value).length;
                            label.textContent = selectedCount ? `${selectedCount} Surah${selectedCount === 1 ? "" : "s"} selected` : "Add surah to queue";
                            menu.querySelectorAll(".custom-select-option").forEach((button) => {
                                const option = Array.from(select.options).find((opt) => opt.value === button.dataset.value);
                                button.setAttribute("aria-selected", String(!!option?.selected));
                            });
                            if (multiAddButton) {
                                multiAddButton.disabled = selectedCount === 0;
                                multiAddButton.textContent = selectedCount ? `Add ${selectedCount} to Queue` : "Add to Queue";
                            }
                            return;
                        }
                        const opt = select.options[select.selectedIndex];
                        label.textContent = opt ? opt.textContent : "Choose an option";
                        menu.querySelectorAll(".custom-select-option").forEach((button, i) => {
                            button.setAttribute("aria-selected", String(select.options[i]?.value === select.value));
                        });
                    }

                    function filterOptions() {
                        const query = search.value.trim().toLocaleLowerCase();
                        optionsBox.querySelectorAll(".custom-select-option").forEach((button) => {
                            button.hidden = !button.textContent.toLocaleLowerCase().includes(query);
                        });
                    }

                    function build() {
                        optionsBox.innerHTML = "";
                        Array.from(select.options).forEach((opt) => {
                            if (isQueueMultiSelect && !opt.value) return;
                            const button = document.createElement("button");
                            button.type = "button";
                            button.className = "custom-select-option";
                            button.textContent = opt.textContent;
                            button.dataset.value = opt.value;
                            button.setAttribute("role", isQueueMultiSelect ? "checkbox" : "option");
                            button.setAttribute("aria-selected", String(isQueueMultiSelect ? opt.selected : opt.value === select.value));
                            button.disabled = opt.disabled;
                            button.addEventListener("click", () => {
                                if (isQueueMultiSelect) {
                                    opt.selected = !opt.selected;
                                    refresh();
                                    return;
                                }
                                select.value = opt.value;
                                select.dispatchEvent(new Event("change", { bubbles: true }));
                                refresh();
                                closeSelectModal(true);
                            });
                            optionsBox.appendChild(button);
                        });
                        if (isQueueMultiSelect) {
                            multiFooter = document.createElement("div");
                            multiFooter.className = "custom-select-menu-footer";
                            multiAddButton = document.createElement("button");
                            multiAddButton.type = "button";
                            multiAddButton.className = "primary-btn custom-select-add-button";
                            multiAddButton.textContent = "Add to Queue";
                            multiAddButton.disabled = true;
                            multiAddButton.addEventListener("click", () => {
                                const selected = Array.from(select.selectedOptions).some((opt) => opt.value);
                                if (!selected) return;
                                select.dispatchEvent(new Event("change", { bubbles: true }));
                                closeSelectModal(true);
                            });
                            multiFooter.appendChild(multiAddButton);
                            menu.appendChild(multiFooter);
                        }
                        refresh();
                    }

                    function open() {
                        if (activeCustomSelect) closeSelectModal();
                        activeCustomSelect = { wrap, trigger, menu, menuSearch: search };
                        wrap.classList.add("open");
                        trigger.setAttribute("aria-expanded", "true");
                        selectBackdrop.classList.add("show");
                        selectBackdrop.setAttribute("aria-hidden", "false");
                        search.value = "";
                        filterOptions();
                        requestAnimationFrame(() => {
                            const selected = optionsBox.querySelector(
                                '.custom-select-option[aria-selected="true"]:not(:disabled)'
                            );
                            const first = optionsBox.querySelector(".custom-select-option:not(:disabled)");
                            const target = selected || first;
                            // Scroll only the options list; scrollIntoView() can also move the page/header.
                            if (target) optionsBox.scrollTop = Math.max(0, target.offsetTop - optionsBox.offsetTop);
                            search.focus();
                        });
                    }

                    closeButton.addEventListener("click", () => closeSelectModal(true));
                    search.addEventListener("input", filterOptions);
                    search.addEventListener("keydown", (e) => {
                        if (e.key === "Escape") {
                            e.preventDefault();
                            closeSelectModal(true);
                        }
                        if (e.key === "ArrowDown") {
                            e.preventDefault();
                            optionsBox.querySelector(".custom-select-option:not(:disabled):not([hidden])")?.focus();
                        }
                    });
                    trigger.addEventListener("click", () => {
                        if (activeCustomSelect?.wrap === wrap) closeSelectModal();
                        else open();
                    });
                    trigger.addEventListener("keydown", (e) => {
                        if (e.key === "Escape") closeSelectModal();
                        if (e.key === "ArrowDown") {
                            e.preventDefault();
                            open();
                        }
                    });
                    menu.addEventListener("keydown", (e) => {
                        if (e.key === "Escape") {
                            closeSelectModal(true);
                        }
                        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
                            const items = [
                                ...optionsBox.querySelectorAll(".custom-select-option:not(:disabled):not([hidden])"),
                            ];
                            if (!items.length) return;
                            e.preventDefault();
                            const i = items.indexOf(document.activeElement);
                            const next =
                                e.key === "ArrowDown"
                                    ? Math.min(items.length - 1, i + 1)
                                    : i < 0
                                      ? 0
                                      : Math.max(0, i - 1);
                            items[next]?.focus();
                            items[next]?.scrollIntoView({ block: "nearest" });
                        }
                    });
                    select.addEventListener("change", refresh);
                    build();
                }

                selectBackdrop.addEventListener("click", () => closeSelectModal());
                function enhanceAllSelects(root = document) {
                    root.querySelectorAll("select.field").forEach(enhanceSelect);
                }
                document.addEventListener("keydown", (e) => {
                    if (e.key === "Escape") closeSelectModal();
                });
                const selectObserver = new MutationObserver(() => enhanceAllSelects(view));
                selectObserver.observe(view, { childList: true, subtree: true });
                enhanceAllSelects();
                init();
            })();
        </script>
    </body>
</html>
