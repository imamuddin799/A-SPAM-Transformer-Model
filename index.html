<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#081d18" />
        <title>Al-Quran — Read, Listen & Reflect</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
            rel="stylesheet"
        />
        
    <style>

            :root {
                --bg: #071813;
                --panel: #0d241d;
                --panel2: #112c23;
                --line: rgba(220, 190, 116, 0.16);
                --gold: #d8b66b;
                --gold2: #f0d99d;
                --text: #f4f0e6;
                --muted: #9caea3;
                --green: #214b3b;
                --danger: #e28a7b;
                --shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
                /* Single shared gap between the sticky header and each page's first content. */
                --page-content-gap: 32px;
                --audio-reader-card-gap: 15px;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: radial-gradient(ellipse at 70% -20%, #1a4232 0, transparent 38%), var(--bg);
                color: var(--text);
                font-family: "DM Sans", sans-serif;
                min-height: 100vh;
            }
            button,
            input,
            select {
                font: inherit;
            }
            button {
                cursor: pointer;
            }
            .app {
                display: grid;
                grid-template-columns: 1fr;
                min-height: 100vh;
            }
            .sidebar {
                position: fixed;
                z-index: 45;
                left: -310px;
                top: 0;
                bottom: 0;
                width: 290px;
                border-right: 1px solid var(--line);
                padding: 20px 10px;
                display: flex;
                flex-direction: column;
                gap: 24px;
                background: #071813;
                transition: left 0.25s;
                box-shadow: var(--shadow);
            }
            .sidebar.open {
                left: 0;
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 0 2px;
            }
            .brand-mark {
                width: 42px;
                height: 42px;
                border: 1px solid var(--gold);
                border-radius: 14px;
                display: grid;
                place-items: center;
                color: var(--gold);
                font-size: 23px;
                background: linear-gradient(145deg, #1b4936, #0b211a);
            }
            .brand-name {
                font-family: "Playfair Display", serif;
                font-size: 21px;
                letter-spacing: 0.4px;
            }
            .brand-sub {
                font-size: 10px;
                letter-spacing: 2px;
                color: var(--gold);
                text-transform: uppercase;
                margin-top: 2px;
            }
            .nav-label {
                font-size: 10px;
                letter-spacing: 1.8px;
                text-transform: uppercase;
                color: #71867a;
                padding: 0 9px;
                margin-bottom: 9px;
            }
            .nav {
                display: grid;
                gap: 5px;
            }
            .nav button {
                border: 0;
                background: transparent;
                color: var(--muted);
                text-align: left;
                padding: 11px 9px;
                border-radius: 12px;
                display: flex;
                align-items: center;
                gap: 12px;
                font-size: 13px;
                transition: 0.2s;
            }
            .nav button:hover,
            .nav button.active {
                background: linear-gradient(90deg, rgba(216, 182, 107, 0.14), rgba(216, 182, 107, 0.035));
                color: var(--gold2);
            }
            .nav-icon {
                width: 19px;
                text-align: center;
                font-size: 16px;
            }
            .side-note {
                margin-top: auto;
                border: 1px solid var(--line);
                background: linear-gradient(145deg, rgba(216, 182, 107, 0.09), transparent);
                border-radius: 16px;
                padding: 16px;
                color: var(--muted);
                font-size: 12px;
                line-height: 1.7;
            }
            .side-note strong {
                color: var(--gold2);
                display: block;
                margin-bottom: 5px;
            }
            .main {
                min-width: 0;
                padding: 0 16px 115px;
                max-width: 1600px;
                width: 100%;
                margin: 0 auto;
            }
            .topbar {
                position: sticky;
                top: 0;
                z-index: 40;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                padding: 13px 0;
                margin-top: 0;
                margin-bottom: 32px;
                background: rgba(7, 24, 19, 0.94);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                border-bottom: 1px solid var(--line);
            }
            .eyebrow {
                color: var(--gold);
                font-size: 10px;
                letter-spacing: 2px;
                text-transform: uppercase;
            }
            .top-title {
                font-family: "Playfair Display", serif;
                font-size: 25px;
                margin-top: 5px;
            }
            .top-actions {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .icon-btn,
            .ghost-btn {
                background: var(--panel);
                border: 1px solid var(--line);
                color: var(--text);
                border-radius: 11px;
                padding: 10px 13px;
            }
            .icon-btn:hover,
            .ghost-btn:hover {
                border-color: var(--gold);
                color: var(--gold2);
            }
            .primary-btn {
                border: 0;
                background: linear-gradient(135deg, #d9b96f, #b58c43);
                color: #17251c;
                padding: 11px 17px;
                border-radius: 11px;
                font-weight: 700;
            }
            .primary-btn:hover {
                filter: brightness(1.08);
            }
            .hero {
                position: relative;
                overflow: hidden;
                border: 1px solid rgba(216, 182, 107, 0.25);
                border-radius: 23px;
                padding: clamp(24px, 4vw, 44px);
                background: linear-gradient(110deg, rgba(20, 58, 43, 0.97), rgba(10, 35, 27, 0.95));
                box-shadow: var(--shadow);
                margin-bottom: 25px;
            }
            .hero:after {
                content: "۞";
                position: absolute;
                right: 4%;
                top: -60px;
                font-size: 280px;
                line-height: 1;
                color: rgba(216, 182, 107, 0.055);
                pointer-events: none;
            }
            .hero-kicker {
                color: var(--gold2);
                font-size: 11px;
                letter-spacing: 2px;
                text-transform: uppercase;
            }
            .hero h1 {
                font:
                    600 clamp(31px, 5vw, 54px) / 1.12 "Playfair Display",
                    serif;
                margin: 14px 0 10px;
                max-width: 650px;
            }
            .hero p {
                color: #c2d0c5;
                max-width: 550px;
                line-height: 1.7;
                font-size: 14px;
            }
            .hero-meta {
                display: flex;
                gap: 22px;
                flex-wrap: wrap;
                margin: 24px 0;
                color: #c1cfc4;
                font-size: 12px;
            }
            .hero-meta span b {
                color: var(--gold2);
                font-weight: 600;
            }
            .hero-actions {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
            }
            .section-head {
                display: flex;
                justify-content: space-between;
                align-items: end;
                gap: 12px;
                margin: 30px 0 15px;
            }
            .section-head h2 {
                font:
                    600 23px "Playfair Display",
                    serif;
                margin: 0;
            }
            .section-head p {
                margin: 5px 0 0;
                color: var(--muted);
                font-size: 12px;
            }
            .stats {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
                margin: 16px 0 24px;
            }
            .stat {
                padding: 17px;
                border: 1px solid var(--line);
                background: rgba(13, 36, 29, 0.78);
                border-radius: 15px;
            }
            .stat-label {
                font-size: 11px;
                color: var(--muted);
            }
            .stat-value {
                font:
                    600 25px "Playfair Display",
                    serif;
                color: var(--gold2);
                margin-top: 7px;
            }
            .stat-foot {
                font-size: 10px;
                color: #71867a;
                margin-top: 3px;
            }
            .grid-2 {
                display: grid;
                grid-template-columns: 1fr;
                gap: 13px;
            }
            .card {
                background: linear-gradient(145deg, rgba(16, 43, 33, 0.95), rgba(10, 30, 23, 0.95));
                border: 1px solid var(--line);
                border-radius: 18px;
                padding: 20px;
                min-width: 0;
            }
            .card-title {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                font-weight: 600;
                font-size: 14px;
                margin-bottom: 15px;
            }
            .muted {
                color: var(--muted);
            }
            .daily-arabic {
                font:
                    30px/1.9 "Noto Naskh Arabic",
                    "Amiri",
                    serif;
                text-align: center;
                color: var(--gold2);
                direction: rtl;
                margin: 8px 0;
            }
            .daily-translation {
                text-align: center;
                line-height: 1.7;
                color: #c5d2c8;
                font-size: 13px;
            }
            .reference {
                text-align: center;
                color: var(--gold);
                font-size: 11px;
                margin: 12px 0;
            }
            .quick-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .quick {
                border: 1px solid var(--line);
                background: rgba(255, 255, 255, 0.025);
                border-radius: 13px;
                padding: 14px;
                text-align: left;
                color: var(--text);
            }
            .quick:hover {
                border-color: var(--gold);
            }
            .quick span {
                display: block;
                font-size: 20px;
                margin-bottom: 8px;
            }
            .quick b {
                font-size: 12px;
            }
            .quick small {
                display: block;
                color: var(--muted);
                font-size: 10px;
                margin-top: 4px;
            }
            .toolbar {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
                margin: 15px 0;
            }
            .field {
                background: #091e17;
                border: 1px solid var(--line);
                color: var(--text);
                padding: 11px 13px;
                border-radius: 11px;
                outline: none;
                min-width: 0;
            }
            .field:focus {
                border-color: var(--gold);
            }
            .field::placeholder {
                color: #71867a;
            }
            .search-field {
                flex: 1;
                min-width: 180px;
            }
            .surah-list {
                display: grid;
                grid-template-columns: 1fr;
                gap: 9px;
            }
            .surah-item {
                display: flex;
                align-items: center;
                gap: 12px;
                border: 1px solid var(--line);
                background: rgba(13, 36, 29, 0.7);
                padding: 14px;
                border-radius: 14px;
                text-align: left;
                color: var(--text);
                min-width: 0;
            }
            .surah-item:hover {
                border-color: var(--gold);
                transform: translateY(-1px);
            }
            .surah-num {
                width: 35px;
                height: 35px;
                display: grid;
                place-items: center;
                border: 1px solid var(--line);
                transform: rotate(45deg);
                border-radius: 9px;
                color: var(--gold);
                font-size: 11px;
                flex-shrink: 0;
            }
            .surah-num span {
                transform: rotate(-45deg);
            }
            .surah-info {
                min-width: 0;
                flex: 1;
            }
            .surah-info b {
                font-size: 13px;
                display: block;
            }
            .surah-info small {
                font-size: 10px;
                color: var(--muted);
            }
            .surah-ar {
                font:
                    22px "Amiri",
                    serif;
                color: var(--gold2);
                white-space: nowrap;
            }
            .reader-head {
                text-align: center;
                padding: 24px 12px;
                border: 1px solid var(--line);
                border-radius: 17px;
                background: linear-gradient(135deg, rgba(216, 182, 107, 0.08), transparent);
                margin-bottom: 17px;
            }
            .reader-head h2 {
                font:
                    600 30px "Playfair Display",
                    serif;
                margin: 0 0 5px;
            }
            .reader-head .arabic-name {
                font:
                    28px "Amiri",
                    serif;
                color: var(--gold2);
            }
            .ayah {
                padding: 24px 5px;
                border-bottom: 1px solid var(--line);
            }
            .ayah-top {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 18px;
            }
            .ayah-ref {
                font-size: 11px;
                color: var(--gold);
                border: 1px solid var(--line);
                border-radius: 20px;
                padding: 6px 10px;
            }
            .ayah-actions {
                display: flex;
                gap: 6px;
            }
            .ayah-actions button {
                background: transparent;
                border: 1px solid var(--line);
                border-radius: 8px;
                color: var(--muted);
                padding: 7px 9px;
            }
            .ayah-actions button:hover {
                color: var(--gold2);
                border-color: var(--gold);
            }
            .ayah-arabic {
                font:
                    32px/2 "Noto Naskh Arabic",
                    "Amiri",
                    serif;
                text-align: right;
                direction: rtl;
                color: #f6f0e3;
                margin: 8px 0 15px;
                overflow-wrap: anywhere;
            }
            .ayah-translit {
                color: var(--gold2);
                font-size: 12px;
                line-height: 1.7;
                margin-bottom: 7px;
            }
            .ayah-translation {
                color: #bdcbbf;
                font-size: 13px;
                line-height: 1.8;
            }
            .reader-settings {
                display: flex;
                gap: 9px;
                flex-wrap: wrap;
                align-items: center;
            }
            .reader-settings label {
                font-size: 11px;
                color: var(--muted);
            }
            .reader-settings select {
                max-width: 180px;
            }
            .empty,
            .loading {
                padding: 35px;
                text-align: center;
                color: var(--muted);
                border: 1px dashed var(--line);
                border-radius: 15px;
            }
            .spinner {
                width: 23px;
                height: 23px;
                border: 2px solid var(--line);
                border-top-color: var(--gold);
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
                margin: 0 auto 10px;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            .result {
                padding: 16px 0;
                border-bottom: 1px solid var(--line);
            }
            .result:last-child {
                border: 0;
            }
            .result .ayah-arabic {
                font-size: 25px;
            }
            .result p {
                font-size: 13px;
                color: #c3d0c6;
                line-height: 1.7;
            }
            .result button {
                margin-top: 8px;
            }
            .player {
                position: fixed;
                z-index: 30;
                bottom: 0;
                left: 0;
                right: 0;
                background: rgba(6, 23, 17, 0.97);
                backdrop-filter: blur(18px);
                border-top: 1px solid var(--line);
                padding: 12px 22px calc(10px + env(safe-area-inset-bottom));
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                grid-template-rows: auto auto;
                align-items: center;
                column-gap: 22px;
                row-gap: 8px;
            }
            .player-info {
                grid-column: 1;
                grid-row: 1;
                width: 100%;
                min-width: 0;
                text-align: left;
            }
            .player-info b {
                font-size: 13px;
                display: block;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .player-info .player-title-tag {
                display: inline;
                font-size: 10px;
                font-weight: 400;
                color: var(--muted);
                white-space: nowrap;
            }
            .player-info small {
                font-size: 10px;
                color: var(--muted);
                display: block;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .player-controls {
                grid-column: 2;
                grid-row: 1;
                display: flex;
                align-items: center;
                justify-content: flex-end;
                gap: 10px;
            }
            .play-btn {
                width: 42px;
                height: 42px;
                border: 0;
                border-radius: 50%;
                background: linear-gradient(145deg, #f0d99d, #c49a4c);
                color: #14251b;
                font-size: 15px;
                box-shadow: 0 5px 16px rgba(216, 182, 107, 0.2);
            }
            .player-controls .icon-btn {
                width: 40px;
                height: 40px;
                display: grid;
                place-items: center;
                border-radius: 12px;
                background: linear-gradient(145deg, #16382b, #0b2119);
                border: 1px solid rgba(220, 190, 116, 0.24);
                font-size: 13px;
                transition:
                    transform 0.18s,
                    border-color 0.18s,
                    background 0.18s;
            }
            .player-controls .icon-btn:hover {
                transform: translateY(-1px);
                border-color: var(--gold);
                background: #1a4231;
            }
            .play-btn:hover {
                filter: brightness(1.08);
                transform: scale(1.04);
            }
            .progress-wrap {
                grid-column: 1 / -1;
                grid-row: 2;
                display: flex;
                align-items: center;
                gap: 10px;
                width: 100%;
                max-width: none;
                font-size: 10px;
                color: var(--muted);
            }
            input[type="range"] {
                accent-color: var(--gold);
                width: 100%;
                min-width: 0;
            }
            .custom-select {
                position: relative;
                display: inline-flex;
                min-width: 150px;
                max-width: 100%;
                width: 100%;
                vertical-align: middle;
            }
            .custom-select > .field {
                position: absolute !important;
                inset: 0;
                width: 100%;
                height: 100%;
                opacity: 0;
                pointer-events: none;
                z-index: -1;
            }
            .custom-select-trigger {
                width: 100%;
                min-height: 43px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 14px;
                padding: 10px 13px;
                border: 1px solid rgba(220, 190, 116, 0.22);
                border-radius: 12px;
                background: linear-gradient(145deg, #102c22, #091d16);
                color: var(--text);
                text-align: left;
                font-size: 12px;
                box-shadow: inset 0 1px rgba(255, 255, 255, 0.025);
                transition:
                    border-color 0.18s,
                    box-shadow 0.18s;
            }
            .custom-select.open .custom-select-trigger,
            .custom-select-trigger:focus-visible {
                outline: none;
                border-color: var(--gold);
                box-shadow: 0 0 0 3px rgba(216, 182, 107, 0.11);
            }
            .custom-select-caret {
                color: var(--gold2);
                font-size: 13px;
                transition: transform 0.18s;
            }
            .custom-select.open .custom-select-caret {
                transform: rotate(180deg);
            }
            .custom-select-menu {
                position: fixed;
                z-index: 1001;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                width: min(440px, calc(100vw - 30px));
                max-height: min(70vh, 560px);
                overflow-y: auto;
                overflow-x: hidden;
                scrollbar-gutter: stable;
                padding: 10px 15px 10px 10px;
                border: 1px solid rgba(220, 190, 116, 0.3);
                border-radius: 16px;
                background: #0b2119;
                background-clip: padding-box;
                box-shadow: 0 24px 70px rgba(0, 0, 0, 0.65);
                display: none;
                overscroll-behavior: contain;
            }
            .custom-select.open .custom-select-menu {
                display: block;
            }
            .custom-select-modal-backdrop {
                position: fixed;
                inset: 0;
                z-index: 1000;
                background: rgba(0, 0, 0, 0.68);
                backdrop-filter: blur(4px);
                display: none;
            }
            .custom-select-modal-backdrop.show {
                display: block;
            }
            .custom-select-menu:before {
                content: attr(data-title);
                display: block;
                padding: 12px 13px 14px;
                color: var(--gold2);
                font:
                    600 17px "Playfair Display",
                    serif;
                border-bottom: 1px solid var(--line);
                margin-bottom: 6px;
            }
            .custom-select-option {
                padding: 12px 13px;
                font-size: 13px;
            }
            .custom-select-menu::-webkit-scrollbar {
                width: 8px;
            }
            .custom-select-menu::-webkit-scrollbar-track {
                background: transparent;
                margin: 12px 0;
                border-radius: 10px;
            }
            .custom-select-menu::-webkit-scrollbar-thumb {
                background: #315341;
                border: 2px solid #0b2119;
                border-radius: 10px;
            }
            .custom-select-option {
                display: flex;
                align-items: center;
                width: 100%;
                padding: 11px 12px;
                margin: 3px 0;
                border: 1px solid rgba(220, 190, 116, 0.2);
                border-radius: 9px;
                background: rgba(255, 255, 255, 0.018);
                color: #c8d5cb;
                text-align: left;
                font-size: 12px;
                line-height: 1.4;
                flex-shrink: 0;
            }
            .custom-select-option:hover,
            .custom-select-option[aria-selected="true"] {
                border-color: rgba(216, 182, 107, 0.65);
            }
            .custom-select-option:hover,
            .custom-select-option[aria-selected="true"] {
                background: rgba(216, 182, 107, 0.13);
                color: var(--gold2);
            }
            .custom-select-option[aria-selected="true"]:after {
                content: "✓";
                margin-left: auto;
                color: var(--gold);
            }
            .audio-library-card {
                max-width: 760px;
            }
            .audio-library-card .toolbar {
                margin: 18px 0 22px;
            }
            .audio-library-card select {
                width: 100%;
            }
            .reader-settings .custom-select {
                flex: 1 1 220px;
                max-width: none;
                min-width: 0;
            }
            .toolbar > .custom-select {
                flex: 1 1 230px;
                min-width: 0;
                width: 100%;
            }
            .custom-select-menu::-webkit-scrollbar {
                width: 8px;
            }
            .custom-select-menu::-webkit-scrollbar-track {
                background: transparent;
                margin: 12px 0;
                border-radius: 10px;
            }
            .custom-select-menu::-webkit-scrollbar-thumb {
                background: #315341;

    /* Viewport layout:
   - The app occupies exactly the viewport height.
   - The main column is the only page scroll container.
   - Header stays sticky at the top of that column.
   - No artificial bottom padding creates phantom scrolling.
*/
    html,
    body {
        height: 100%;
        min-height: 0;
        overflow: hidden;
    }
    .app {
        height: 100vh;
        height: 100dvh;
        min-height: 0 !important;
        overflow: hidden;
    }
    .main {
        height: 100vh;
        height: 100dvh;
        min-height: 0 !important;
        min-width: 0;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior-y: contain;
        padding-top: 0 !important;
        padding-bottom: 0 !important;
        scrollbar-gutter: stable;
    }
    .main > .topbar {
        position: sticky !important;
        top: 0 !important;
        z-index: 80;
        margin-top: 0 !important;
        background: #071813 !important;
        -webkit-backdrop-filter: none !important;
        backdrop-filter: none !important;
        isolation: isolate;
    }
    /* Keep the desktop navigation fitted to the same viewport shell. */
    @media (min-width: 901px) {
        .sidebar {
            height: 100vh;
            height: 100dvh;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
        }
    }



/* =========================================
   VIEWPORT LAYOUT FIX
   Header: sticky
   Main content: independently scrollable
   Audio player: always visible at bottom
   ========================================= */

html,
body {
  width: 100%;
  height: 100%;
  min-height: 0;
  margin: 0;
  overflow: hidden;
}

body {
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  height: 100vh;
  height: 100dvh;
}

/* Main application occupies remaining viewport space */
.app {
  grid-row: 1;
  height: 100%;
  min-height: 0 !important;
  overflow: hidden;
}

/* Only main content scrolls */
.main {
  height: 100%;
  min-height: 0 !important;
  min-width: 0;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior-y: contain;
  padding-top: 0 !important;
  padding-bottom: 16px !important;
}

/* Sticky header */
.main > .topbar {
  position: sticky !important;
  top: 0 !important;
  z-index: 80;
  margin-top: 0 !important;
  margin-bottom: 0 !important;
  background: #071813 !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
}

/* One consistent header-to-content gap for every page. */
.main > #view {
  padding-top: var(--page-content-gap);
}
.main > #view > :first-child {
  margin-top: 0 !important;
}
.main > #view > .audio-reader-layout > :first-child {
  margin-top: 0 !important;
}

/* Audio player becomes the second body grid row */
.player {
  position: relative !important;
  grid-row: 2;
  left: auto !important;
  right: auto !important;
  bottom: auto !important;
  width: 100%;
  z-index: 90;
}

/* Sidebar retains its own scrolling */
.sidebar {
  height: 100%;
  min-height: 0;
  overflow-y: auto;
}

/* Desktop player starts after sidebar */
@media (min-width: 901px) {
  .player {
    margin-left: 290px;
    width: calc(100% - 290px);
  }
}

/* Mobile layout */
@media (max-width: 900px) {
  .player {
    margin-left: 0;
    width: 100%;
  }
  .sidebar {
    z-index: 200 !important;
    top: 0 !important;
    bottom: 0 !important;
    height: 100dvh;
    max-height: 100dvh;
  }
}

/* Player timeline: keep timestamps directly below the seek bar. */
.progress-wrap {
  display: grid !important;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto auto;
  column-gap: 10px;
  row-gap: 3px;
  align-items: center;
}
.progress-wrap input[type="range"] {
  grid-column: 1 / -1;
  grid-row: 1;
}
.progress-wrap #currentTime {
  grid-column: 1;
  grid-row: 2;
  justify-self: start;
}
.progress-wrap #duration {
  grid-column: 2;
  grid-row: 2;
  justify-self: end;
}



/* Audio + Ayah Highlight reader */
.audio-reader-controls {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    margin-top: 14px;
}
.audio-reader-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 16px;
}
.audio-reader-status {
    margin-top: 13px;
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--muted);
    background: rgba(255,255,255,.025);
    font-size: 12px;
    line-height: 1.6;
}
.audio-reader-status.error {
    color: #f0b1a8;
    border-color: rgba(226,138,123,.35);
}
.audio-reader-status.success {
    color: #b9d8bd;
    border-color: rgba(113,177,125,.28);
}
.audio-reader-progress {
    width: 100%;
    height: 5px;
    overflow: hidden;
    margin-top: 9px;
    border-radius: 99px;
    background: rgba(255,255,255,.08);
}
.audio-reader-progress > span {
    display: block;
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: var(--gold);
    transition: width .18s ease;
}
.audio-reader-text-card {
    margin-top: var(--audio-reader-card-gap);
    padding: 0;
}
/* Audio + Ayah layout:
   - Controls remain in normal page flow and scroll away above the reader.
   - Short Surahs use only their natural content height.
   - Long Surahs are capped to the available viewport height; only Arabic
     Ayah content scrolls, while its heading and footer remain visible.
*/
.audio-reader-layout {
    display: flex;
    flex-direction: column;
    min-height: 0;
}
.audio-reader-layout > .section-head,
.audio-reader-layout > .audio-library-card {
    flex: 0 0 auto;
}
#audioReaderText {
    flex: 0 0 auto;
    min-height: 0;
    height: auto;
    max-height: none;
    margin-top: 0;
    overflow: visible;
}
.audio-reader-text-card {
    position: relative;

    min-height: 0;
    max-height: var(--audio-reader-max-height, none);
    overflow: hidden;
    gap: 0;

    position: sticky;
    top: 0;
    z-index: 2;
    flex: 0 0 auto;

    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior-y: auto;
    -webkit-overflow-scrolling: touch;
    direction: rtl;
    text-align: justify;
    text-align-last: center;
    line-height: 2.15;
    padding: 4px 8px 6px;

    display: inline;
    padding: 3px 2px;
    border-radius: 8px;
    transition: background-color .18s ease, color .18s ease, box-shadow .18s ease;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
}

.audio-reader-footnote {
    position: sticky;
    bottom: 0;
    z-index: 2;
    flex: 0 0 auto;
    margin-top: 4px;
    padding: 4px 8px 2px;
    color: var(--muted);
    font-size: 10px;
    line-height: 1.25;
    text-align: center;
    background: transparent;
}
@media (max-width: 650px) {
    .audio-reader-controls { grid-template-columns: 1fr; gap: 10px; }
    .audio-reader-text { line-height: 2.05; }
    .audio-reader-surah-heading { align-items: center; flex-direction: row; flex-wrap: nowrap; gap: 6px; }
    .audio-reader-heading-copy { flex: 0 1 auto; }
    .audio-reader-surah-heading { justify-content: space-between; }

.audio-reader-scroll-actions {

.audio-reader-scroll-btn {

.audio-reader-current-ayah { display: block; margin: 0; line-height: 1.2; }

/* Bulk reciter timing JSON exporter */

        <script>
            (() => {
                "use strict";
                const API = "https://ummahapi.com";
                const $ = (s) => document.querySelector(s);
                const view = $("#view");
                const state = {
                    page: "home",
                    surahs: [],
                    meta: null,
                    reciters: [],
                    currentSurah: 1,
                    currentAyah: 1,
                    script: "indopak",
                    translation: "sahih_international",
                    reciter: "",
                    bookmarks: JSON.parse(localStorage.getItem("alquran_bookmarks") || "[]"),
                    lastRead: JSON.parse(localStorage.getItem("alquran_lastread") || "null"),
                    lastRecited: JSON.parse(localStorage.getItem("alquran_lastrecited") || "null"),
                    audioQueue: [],
                    audioIndex: 0,
                    audioLibraryPlaylists: (() => { try { const v = JSON.parse(localStorage.getItem("alquran_audio_playlists") || "[]"); return Array.isArray(v) ? v.filter(p => p && typeof p === "object").map((p, i) => ({ id: String(p.id || `legacy-${i}`), name: String(p.name || `Playlist ${i+1}`), surahs: Array.isArray(p.surahs) ? p.surahs.map(Number).filter(n => Number.isInteger(n) && n >= 1 && n <= 114) : [] })) : []; } catch (_) { return []; } })(),
                    audioLibraryQueue: (() => { try { const v = JSON.parse(localStorage.getItem("alquran_audio_library_queue") || "[]"); return Array.isArray(v) ? v.map(Number).filter(n => Number.isInteger(n) && n >= 1 && n <= 114) : []; } catch (_) { return []; } })(),
                    audioLibraryPlayback: null,
                    audioPlaybackContext: null,
                    // Keep the origin of the currently loaded full-Surah audio separate
                    // from the live-highlight context, which page rendering may restore.
                    audioPlaybackSource: null,
                    audioNextInProgress: false,
                    audioReaderPrepared: null,
                    audioReaderRequestId: 0,
                    timingExportRunning: false,
                    timingExportStopRequested: false,
                    timingExportMemoryRecords: [],
                    theme: "dark",
                };
                const audio = $("#audio");
                let showWakeLockDebug = localStorage.getItem("quranShowWakeLockDebug") === "true";
                let audioReaderWakeLock = null;
                let audioReaderWakeLockRequest = 0;
                let audioReaderWakeLockLastError = "None";
                let audioReaderWakeLockLastEvent = "Not requested yet";
                let audioReaderWakeLockLastAttempt = 0;
                function updateAudioReaderWakeLockDebug() {
                    const panel = document.getElementById("audioReaderWakeLockDebug");
                    if (!panel) return;
                    const supported = !!navigator.wakeLock && typeof navigator.wakeLock.request === "function";
                    const rows = {
                        support: supported ? "Supported" : "Not supported",
                        secure: window.isSecureContext ? "Yes" : "No",
                        page: state.page,
                        visibility: document.visibilityState,
                        playback: audio.ended ? "Ended" : (audio.paused ? "Paused" : "Playing"),
                        lock: audioReaderWakeLock && !audioReaderWakeLock.released ? "Acquired" : "Not held",
                        event: audioReaderWakeLockLastEvent,
                        error: audioReaderWakeLockLastError,
                    };
                    Object.entries(rows).forEach(([key, value]) => {
                        const node = panel.querySelector(`[data-wakelock-debug="${key}"]`);
                        if (node) node.textContent = value;
                    });
                }
                function shouldHoldAudioReaderWakeLock() {
                    return state.page === "audio-reader" && !document.hidden && !audio.paused && !audio.ended;
                }
                async function syncAudioReaderWakeLock(allowBeforePlayback = false) {
                    const requestId = ++audioReaderWakeLockRequest;
                    const shouldKeepLock = () => shouldHoldAudioReaderWakeLock() || (
                        allowBeforePlayback && state.page === "audio-reader" && !document.hidden
                    );
                    if (!shouldKeepLock()) {
                        if (audioReaderWakeLock) {
                            const lock = audioReaderWakeLock;
                            audioReaderWakeLock = null;
                            try {
                                await lock.release();
                                audioReaderWakeLockLastEvent = "Released by app (not required)";
                            } catch (error) {
                                audioReaderWakeLockLastError = `${error?.name || "Error"}: ${error?.message || error}`;
                            }
                        }
                        updateAudioReaderWakeLockDebug();
                        return;
                    }
                    if (!navigator.wakeLock || typeof navigator.wakeLock.request !== "function") {
                        audioReaderWakeLockLastEvent = "Wake Lock API unavailable";
                        updateAudioReaderWakeLockDebug();
                        return;
                    }
                    if (audioReaderWakeLock) {
                        updateAudioReaderWakeLockDebug();
                        return;
                    }
                    audioReaderWakeLockLastAttempt = Date.now();
                    audioReaderWakeLockLastEvent = "Requesting screen lock…";
                    updateAudioReaderWakeLockDebug();
                    try {
                        const lock = await navigator.wakeLock.request("screen");
                        if (requestId !== audioReaderWakeLockRequest || !shouldKeepLock()) {
                            try { await lock.release(); } catch (error) { /* Ignore a stale Wake Lock request. */ }
                            return;
                        }
                        audioReaderWakeLock = lock;
                        audioReaderWakeLockLastError = "None";
                        audioReaderWakeLockLastEvent = "Acquired successfully";
                        lock.addEventListener("release", () => {
                            if (audioReaderWakeLock === lock) {
                                audioReaderWakeLock = null;
                                audioReaderWakeLockLastEvent = shouldHoldAudioReaderWakeLock()
                                    ? "Released by browser/OS while audio was playing"
                                    : "Released";
                                updateAudioReaderWakeLockDebug();
                            }
                        }, { once: true });
                    } catch (error) {
                        audioReaderWakeLockLastError = `${error?.name || "Error"}: ${error?.message || error}`;
                        audioReaderWakeLockLastEvent = "Acquisition failed";
                    }
                    updateAudioReaderWakeLockDebug();
                }
                document.addEventListener("visibilitychange", () => {
                    void syncAudioReaderWakeLock();
                    updateAudioReaderWakeLockDebug();
                });
                const esc = (s) =>
                    String(s ?? "").replace(
                        /[&<>"']/g,
                        (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]
                    );
                const unwrap = (x) => x?.data ?? x?.result ?? x;
                const asArray = (x) => {
                    x = unwrap(x);
                    if (Array.isArray(x)) return x;
                    if (!x || typeof x !== "object") return [];
                    for (const k of [
                        "surahs",
                        "ayahs",
                        "verses",
                        "results",
                        "reciters",
                        "items",
                        "data",
                        "words",
                        "pages",
                    ])
                        if (Array.isArray(x[k])) return x[k];
                    for (const v of Object.values(x)) if (Array.isArray(v)) return v;
                    return [];
                };
                const pick = (o, keys, fallback = "") => {
                    for (const k of keys) {
                        const v = o?.[k];
                        if (v !== undefined && v !== null && v !== "") return v;
                    }
                    return fallback;
                };
                const surahName = (s) =>
                    pick(
                        s,
                        ["english_name", "name_english", "englishName", "name", "transliteration"],
                        `Surah ${pick(s, ["number", "id"], "")}`
                    );
                const surahArabic = (s) => pick(s, ["arabic_name", "name_arabic", "arabicName", "name_ar"], "سورة");
                const verseText = (a) =>
                    pick(a, ["text_uthmani", "text", "arabic", "text_arabic", "uthmani", "text_uthmani_tajweed"], "");
                const verseTranslation = (a) => {
                    let v = pick(
                        a,
                        ["translation", "text_translation", "english_translation", "translated_text", "text_english"],
                        ""
                    );
                    if (typeof v === "object") v = pick(v, ["text", "translation", "sahih_international"], "");
                    if (!v && a?.translations) {
                        const t = a.translations;
                        v = typeof t === "string" ? t : pick(t, [state.translation, "sahih_international", "en"], "");
                        if (typeof v === "object") v = pick(v, ["text", "translation"], "");
                    }
                    return v;
                };
                const verseNumber = (a) =>
                    pick(a, ["number_in_surah", "ayah_number", "number", "verse_number", "ayah"], "");
                const refOf = (a) =>
                    pick(
                        a,
                        ["reference", "verse_key", "key"],
                        `${state.currentSurah}:${verseNumber(a) || state.currentAyah}`
                    );
                function notify(msg) {
                    const t = $("#toast");
                    t.textContent = msg;
                    t.classList.remove("hidden");
                    clearTimeout(notify.timer);
                    notify.timer = setTimeout(() => t.classList.add("hidden"), 2500);
                }
                function loading(msg = "Loading Quran data…") {
                    view.innerHTML = `<div class="loading"><div class="spinner"></div>${esc(msg)}</div>`;
                }
                function errorBox(err) {
                    view.innerHTML = `<div class="empty"><div style="font-size:25px;margin-bottom:8px">⚠</div><b>Unable to load this content</b><p>${esc(err.message || "Please check your connection and try again.")}</p><button class="primary-btn" onclick="location.reload()">Retry</button></div>`;
                }
                async function api(path, opts = {}) {
                    const r = await fetch(API + path, {
                        ...opts,
                        headers: {
                            Accept: "application/json",
                            "Content-Type": "application/json",
                            ...(opts.headers || {}),
                        },
                    });
                    let data;
                    try {
                        data = await r.json();
                    } catch {
                        throw new Error(`API returned an unreadable response (${r.status})`);
                    }
                    if (!r.ok || data?.success === false)
                        throw new Error(data?.message || data?.error || `Request failed (${r.status})`);
                    return data;
                }
                function title(t) {
                    $("#pageTitle").textContent = t;
                }
                function nav(page) {
                    state.page = page;
                    void syncAudioReaderWakeLock();
                    document
                        .querySelectorAll(".nav button")
                        .forEach((b) => b.classList.toggle("active", b.dataset.page === page));
                    document
                        .querySelectorAll("[data-bottom]")
                        .forEach((b) => b.classList.toggle("active", b.dataset.bottom === page));
                    $("#sidebar").classList.remove("open");
                }
                function settingsPage() {
                    title("Settings");
                    view.innerHTML = `<div class="section-head"><div><h2>Settings</h2><p>Application settings and advanced tools.</p></div></div>
                        <div class="card" style="margin-top:16px">
                            <details>
                                <summary style="cursor:pointer;color:var(--gold2);font-weight:600;list-style-position:inside">Developer Only</summary>
                                <p class="muted" style="font-size:12px;line-height:1.7">Advanced development and data maintenance tools.</p>
                                <label style="display:flex;align-items:center;gap:10px;margin:12px 0;font-size:13px">
                                    <input type="checkbox" id="showWakeLockDebugSetting" ${showWakeLockDebug ? "checked" : ""}>
                                    Show Temporary Wake Lock Debug Status
                                </label>
                                <button class="ghost-btn" id="openTimingExport">⇩ Timing Data Export</button>
                            </details>
                        </div>`;
                    $("#showWakeLockDebugSetting").onchange = (event) => {
                        showWakeLockDebug = Boolean(event.target.checked);
                        localStorage.setItem("quranShowWakeLockDebug", String(showWakeLockDebug));
                    };
                    $("#openTimingExport").onclick = () => go("timing-export");
                }
                function go(page) {
                    // Keep the prepared Surah and its playback context while navigating.
                    // The persistent audio player may continue playing on other pages;
                    // audio-reader restores its Ayah view when the user returns.
                    nav(page);
                    (
                        ({
                            home: home,
                            reader: readerPage,
                            search: searchPage,
                            juz: juzPage,
                            mushaf: mushafPage,
                            bookmarks: bookmarksPage,
                            words: wordsPage,
                            reciters: recitersPage,
                            settings: settingsPage,
                            audio: audioPage,
                            "audio-reader": audioAyahReaderPage,
                            "timing-export": audioTimingExportPage,
                        })[page] || home
                    )();
                }
                function loadingCard(text) {
                    return `<div class="loading"><div class="spinner"></div>${esc(text)}</div>`;
                }
                function getSurah(n) {
                    return (
                        state.surahs.find((s) => Number(pick(s, ["number", "id", "surah_number"])) === Number(n)) ||
                        state.surahs[n - 1] ||
                        {}
                    );
                }
                function normalizeSurahArray(data) {
                    return asArray(data).map((s, i) => ({
                        ...s,
                        number: Number(pick(s, ["number", "id", "surah_number"], i + 1)),
                    }));
                }
                async function init() {
                    try {
                        const [meta, surahs, reciters] = await Promise.all([
                            api("/api/quran"),
                            api("/api/quran/surahs"),
                            api("/api/quran/reciters"),

                        errorBox(e);

                }
                function home() {
                    title("Assalamu Alaikum");
                    view.innerHTML = `
<section class="hero"><div class="hero-kicker">The Noble Quran · القرآن الكريم</div><h1>A light for the heart.<br>A guide for life.</h1><p>Make space for reflection. Read the words of Allah, listen to beautiful recitation, and build a lasting connection with the Quran.</p><div class="hero-meta"><span><b>114</b> Surahs</span><span><b>30</b> Juz</span><span><b>6,236</b> Ayahs*</span><span><b>604</b> Mushaf pages</span></div><div class="hero-actions"><button class="primary-btn" id="startReading">Continue reading →</button><button class="ghost-btn" id="randomVerse">✧ Discover an Ayah</button></div><div style="font-size:9px;color:#8ea398;margin-top:12px">*Commonly cited verse count; numbering conventions can vary.</div></section>
<div class="stats"><div class="stat"><div class="stat-label">Surahs available</div><div class="stat-value">${state.surahs.length || 114}</div><div class="stat-foot">Complete Quran</div></div><div class="stat"><div class="stat-label">Your bookmarks</div><div class="stat-value">${state.bookmarks.length}</div><div class="stat-foot">Saved verses</div></div><div class="stat"><div class="stat-label">Last recited</div><div class="stat-value" style="font-size:${state.lastRecited ? "19px" : "25px"}">${state.lastRecited ? `${esc(state.lastRecited.name)} ${state.lastRecited.ayah ? `· ${state.lastRecited.ayah}` : ""}` : "Not yet"}</div><div class="stat-foot">${state.lastRecited ? "Resume your last recitation" : "Your recitation will appear here"}</div></div><div class="stat"><div class="stat-label">Available reciters</div><div class="stat-value">${state.reciters.length || 13}</div><div class="stat-foot">Audio voices</div></div></div>
<div class="grid-2"><div class="card"><div class="card-title">✧ Ayah for reflection <button class="icon-btn" id="refreshVerse">↻</button></div><div id="dailyVerse">${loadingCard("Finding an Ayah…")}</div></div><div class="card"><div class="card-title">Explore the Quran</div><div class="quick-grid"><button class="quick" data-go="reader"><span>📖</span><b>Read Quran</b><small>Browse all Surahs</small></button><button class="quick" data-go="search"><span>⌕</span><b>Search</b><small>Find words & verses</small></button><button class="quick" data-go="juz"><span>◈</span><b>Juz</b><small>30 reading sections</small></button><button class="quick" data-go="mushaf"><span>▧</span><b>Mushaf</b><small>604 page view</small></button></div></div></div>
<div class="section-head"><div><h2>Surah collection</h2><p>Begin with any chapter of the Holy Quran.</p></div><button class="ghost-btn" id="allSurahs">View all →</button></div><div id="homeSurahs" class="surah-list"></div>`;
                    $("#startReading").onclick = () => {
                        const last = state.lastRecited || state.lastRead;
                        last ? loadSurah(last.surah, last.ayah || 1) : go("reader");

                    if (!list.length) {

                    el.innerHTML = list

imary-btn" id="nextSurah" ${n === 114 ? "disabled" : ""}>Next Surah ←</button><span class="reader-surah-ayah">Surah: ${n} · Ayah: ${focusAyah}</span><button class="ghost-btn" id="prevSurah" ${n === 1 ? "disabled" : ""}>Previous Surah →</button></div>`;

                function sanitizeTajweed(s) {

                            (m, close, tag, cls) => `<${close}${tag}${cls ? ` class="${cls}"` : ""}>`

                function searchPage() {

                const JUZ_START_PAGES = [

                function mushafFontFamily(font) {
                    return font === "indopak"
                        ? "'Noto Naskh Arabic','Amiri',serif"
                        : font === "uthmani"
                          ? "'Noto Naskh Arabic','Amiri',serif"
                          : "'Amiri','Noto Naskh Arabic',serif";
                }
                function extractMushafText(value, font = "indopak") {
                    if (typeof value === "string" || typeof value === "number") return String(value);
                    if (Array.isArray(value))
                        return value
                            .map((v) => extractMushafText(v, font))
                            .filter(Boolean)
                            .join(" ");
                    if (!value || typeof value !== "object") return "";
                    const keys =
                        font === "indopak"
                            ? ["text_indopak", "text_indo_pak", "text_uthmani", "text", "arabic", "word"]
                            : font === "uthmani"
                              ? ["text_uthmani", "text", "arabic", "word"]
                              : ["text_naskh", "text", "text_uthmani", "arabic", "word"];
                    for (const key of keys) {
                        const v = value[key];
                        if (typeof v === "string" || typeof v === "number") return String(v);
                        if (Array.isArray(v)) return extractMushafText(v, font);
                    }
                    for (const key of ["words", "tokens", "ayahs", "verses", "data", "result"])
                        if (value[key] !== undefined) {
                            const out = extractMushafText(value[key], font);
                            if (out) return out;
                        }
                    return "";
                }
                function arabicIndicNumber(value) {
                    return String(value).replace(/[0-9]/g, (d) => "٠١٢٣٤٥٦٧٨٩"[Number(d)]);

                function renderMushafWords(words, font) {

                        font === "indopak"
                            ? ["text_indopak", "text_indo_pak", "text_uthmani"]
                            : font === "uthmani"
                              ? ["text_uthmani", "text_uthmani_tajweed"]
                              : ["text_naskh", "text_uthmani"];
                    return words
                        .map((word) => {
                            const raw =
                                textKeys.map((k) => word?.[k]).find((v) => typeof v === "string" && v.trim()) ??
                                word?.text;
                            const text = typeof raw === "string" || typeof raw === "number" ? String(raw) : "";
                            if (word?.char_type_name === "end") {
                                const marker = text || arabicIndicNumber(word?.ayah_number ?? "");
                                return `<span class="mushaf-ayah-marker" aria-label="Ayah ${esc(word?.ayah_number ?? "")}">${esc(marker)}</span>`;
                            }
                            return text ? `<span class="mushaf-word">${esc(text)}</span>` : "";
                        })
                        .join(" ");

                        else if (playlist && b.dataset.playlistRemove !== undefined) {

                            if (playback) { if (playback.position === from) playback.position = to; else if (from < playback.position && to >= playback.position) playback.position--; else if (from > playback.position && to <= playback.position) playback.position++; }

                    };
                    $("#audioQueueList").onclick = (event) => {

                        if (b.dataset.queueRemove !== undefined) {

                    };
                    let draggedAudioItem = null;
                    const bindAudioDrag = (host) => {
                        let placeholder = null;
                        let pointerId = null;
                        let floatingRow = null;
                        let sourceRow = null;
                        let sourceOriginalStyle = null;
                        let dragStarted = false;
                        const belongsToDragGroup = (row) => row && row.dataset.dragKind === draggedAudioItem?.kind &&
                            (row.dataset.playlistId || null) === draggedAudioItem?.playlistId;
                        const getItems = () => draggedAudioItem.kind === "queue"
                            ? state.audioLibraryQueue
                            : (state.audioLibraryPlaylists.find(p => p.id === draggedAudioItem.playlistId)?.surahs || []);
                        const groupRows = () => Array.from(host.querySelectorAll('[data-drag-kind]')).filter(row =>
                            belongsToDragGroup(row) && row !== placeholder);
                        const animateReflow = (movePlaceholder) => {
                            const before = groupRows().map(row => [row, row.getBoundingClientRect()]);
                            movePlaceholder();
                            before.forEach(([row, rect]) => {
                                const next = row.getBoundingClientRect();
                                const dx = rect.left - next.left;
                                const dy = rect.top - next.top;
                                if (dx || dy) {
                                    row.style.transition = "none";
                                    row.style.transform = `translate(${dx}px, ${dy}px)`;
                                    row.getBoundingClientRect();
                                    requestAnimationFrame(() => {
                                        row.style.transition = "transform 180ms cubic-bezier(.2,.75,.25,1)";
                                        row.style.transform = "";
                                    });
                                }
                            });
                        };
                        const clearPreview = () => {
                            // Put the exact same DOM row back; no faded source row or duplicate clone.
                            if (sourceRow && placeholder?.parentNode) placeholder.parentNode.insertBefore(sourceRow, placeholder);
                            placeholder?.remove(); placeholder = null;
                            if (sourceRow) {
                                sourceRow.classList.remove("is-dragging", "is-dragging-source");
                                if (sourceOriginalStyle === null) sourceRow.removeAttribute("style");
                                else sourceRow.setAttribute("style", sourceOriginalStyle);
                            }
                            floatingRow = null;
                            host.querySelectorAll('[data-drag-kind]').forEach(row => {
                                row.style.transition = "";
                                row.style.transform = "";
                            });
                            sourceRow = null; sourceOriginalStyle = null; dragStarted = false;
                        };
                        const positionPlaceholder = (x, y) => {
                            if (!dragStarted || !draggedAudioItem || !placeholder) return;
                            const rows = groupRows();
                            if (!rows.length) return;
                            const under = document.elementFromPoint(x, y)?.closest('[data-drag-kind]');
                            let reference = null;
                            if (belongsToDragGroup(under)) {
                                const rect = under.getBoundingClientRect();
                                reference = y > rect.top + rect.height / 2 ? under.nextSibling : under;
                            } else {
                                const first = rows[0];
                                const last = rows[rows.length - 1];
                                if (y < first.getBoundingClientRect().top) reference = first;
                                else if (y > last.getBoundingClientRect().bottom) reference = last.nextSibling;
                                else return;
                            }
                            if (reference === placeholder || reference === placeholder.nextSibling) return;
                            animateReflow(() => placeholder.parentNode.insertBefore(placeholder, reference));
                        };
                        const finishReorder = (commit = true) => {
                            if (!draggedAudioItem) return;
                            if (commit && dragStarted && placeholder?.parentNode) {
                                const from = draggedAudioItem.from;
                                let to = 0;
                                for (let node = placeholder.parentNode.firstElementChild; node && node !== placeholder; node = node.nextElementSibling) {
                                    if (belongsToDragGroup(node)) to++;
                                }
                                const items = getItems();
                                if (items.length && from >= 0 && from < items.length) {
                                    const boundedTo = Math.max(0, Math.min(items.length - 1, to));
                                    moveAudioLibraryItem(items, from, boundedTo);
                                    if (draggedAudioItem.kind === "playlist") {
                                        const playback = state.audioLibraryPlayback?.mode === "playlist" && state.audioLibraryPlayback.playlistId === draggedAudioItem.playlistId ? state.audioLibraryPlayback : null;
                                        if (playback) {
                                            if (playback.position === from) playback.position = boundedTo;
                                            else if (from < playback.position && boundedTo >= playback.position) playback.position--;

                                    }

                            if (commit) { persistAudioLibraryCollections(); renderAudioLibraryCollections(); }

                                margin: "0", opacity: "1", transition: "none"

                    };
                    bindAudioDrag($("#audioQueueList"));

                }
                // Audio + Ayah Highlight: one full-Surah text request, one full-Surah
                // audio request, and reciter-specific Ayah duration data cached in IndexedDB.
                const AUDIO_TIMING_CACHE_DB = "alquran-audio-timing-cache";
                const AUDIO_TIMING_CACHE_VERSION = 3;
                const AUDIO_TIMING_DB_VERSION = 4;
                const AUDIO_TIMING_CACHE_TTL = 180 * 24 * 60 * 60 * 1000;
                let audioTimingDbPromise = null;

                function getReciterId(reciter) {
                    return String(pick(reciter, ["id", "reciter_id", "reciterId", "key"], "") || "").trim();
                }
                function normalizeReciterName(value) {
                    return String(value || "")
                        .normalize("NFD")
                        .replace(/[\u0300-\u036f]/g, "")
                        .toLowerCase()
                        .replace(/[^a-z0-9]/g, "");
                }
                function getReciterName(reciter) {
                    return String(pick(reciter, ["name", "english_name", "reciter_name", "reciterName", "reciter"], "") || "").trim();
                }
                // These two reciters provide full-Surah audio but no individual Ayah audio.
                // Exclude them only from features that require Ayah-by-Ayah audio.
                function isAyahAudioUnavailableReciter(reciter) {
                    const id = getReciterId(reciter);
                    const name = normalizeReciterName(getReciterName(reciter));
                    return id === "12" || id === "13" || name === "bandarbaleela" || name === "abdullahalbuajan";
                }
                function getAyahAudioReciters() {
                    return state.reciters.filter((reciter) => !isAyahAudioUnavailableReciter(reciter));
                }

                function audioReaderPageIsCurrent(requestId) {

                function setAudioReaderStatus(message, type = "", progress = null) {
                    const status = $("#audioReaderStatus");
